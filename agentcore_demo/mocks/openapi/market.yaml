openapi: 3.1.0
info:
  title: Advisor Copilot - Market Data API (mock)
  description: >-
    Synthetic market snapshot quotes for the Advisor Copilot POC. AgentCore
    Gateway converts this schema into an MCP tool; operation descriptions become
    the tool descriptions the agent reads when selecting tools.
  version: "1.0.0"
paths:
  /quotes/{ticker}:
    get:
      operationId: getMarketQuote
      summary: Get a single market quote
      description: >-
        Return the latest synthetic snapshot quote for one ticker, including last
        price, intraday percentage change, trailing P/E (null for instruments
        without one, such as bond ETFs), and the as-of timestamp.
      parameters:
        - name: ticker
          in: path
          required: true
          description: Ticker symbol, e.g. NVDA.
          schema:
            type: string
      responses:
        "200":
          description: The quote for the requested ticker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: No quote exists for the supplied ticker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /quotes:
    get:
      operationId: getMarketQuotes
      summary: Get quotes for multiple tickers
      description: >-
        Return snapshot quotes for several tickers at once. Supply a
        comma-separated list of ticker symbols; unknown tickers are omitted from
        the result.
      parameters:
        - name: tickers
          in: query
          required: true
          description: Comma-separated ticker symbols, e.g. NVDA,AGG,MSFT.
          schema:
            type: string
      responses:
        "200":
          description: An array of quotes for the recognized tickers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
components:
  schemas:
    Quote:
      type: object
      description: A synthetic market snapshot quote.
      required: [ticker, last, change_pct, pe, as_of]
      properties:
        ticker:
          type: string
          description: Ticker symbol.
        last:
          type: number
          description: Last traded price.
        change_pct:
          type: number
          description: Intraday percentage change.
        pe:
          type: [number, "null"]
          description: Trailing price-to-earnings ratio, or null if not applicable.
        as_of:
          type: string
          description: ISO 8601 timestamp of the snapshot.
    Error:
      type: object
      description: Error payload returned for client or server errors.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
