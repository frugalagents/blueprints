<script id="workshop-data" type="application/json">{"title":"Tokenomics for Custom-Built Agents","subtitle":"A companion to the Bedrock Claude Code workshop — for when you are the one writing the agent loop, not configuring someone else's.","tabs":[{"id":"foundations","title":"Foundations: Why a Custom Agent's Economics Are Different","tier":0,"tierLabel":"No infrastructure — just the mental model","status":"stable","summary":"When you build the agent loop yourself, every cost lever that Claude Code's harness handled for you becomes something you must design and own explicitly.","whyItMatters":"Misunderstanding this is the single biggest source of runaway cost in custom agents: teams port an interactive, human-supervised mental model onto an unattended, high-volume system.","concepts":[{"heading":"Five things a harness gives you for free","body":"Claude Code (or any polished agentic CLI) quietly handles: context compaction (/compact), model selection (/model), a human watching for runaway loops, prompt structuring for cache hits, and usage visibility (/usage). Building your own agent means each of these becomes a design decision, not a given."},{"heading":"Volume changes the math","body":"An interactive developer session is bounded by how long a person sits at a keyboard — tens of turns a day. A production agent can run thousands of unattended invocations. Per-call cost multiplied by volume dominates; a $0.002 inefficiency per call is irrelevant at 50 calls/day and existential at 500,000."},{"heading":"The four things you now own","body":"1) Context growth — nothing stops it unless you write the stopping logic. 2) Tool schema tax — every registered tool costs input tokens on every single call, whether used or not. 3) Runaway loops — no human is present to notice and hit Escape. 4) Cost visibility — you must instrument it yourself, off raw API responses or provider billing metrics."},{"heading":"Why this workshop uses Strands, not raw API calls","body":"The exercises below build agents with the Strands Agents SDK (AWS's open-source agent framework) running on Amazon Bedrock, rather than hand-rolled loops around a raw messages.create call. Strands already ships a real agent loop, a conversation manager, a hooks system, and native Bedrock prompt/tool caching -- the exact primitives this workshop is teaching you to reason about. Where Strands has a built-in for a pattern, the exercise uses it directly instead of reinventing it."}],"exercises":[{"title":"Measure the fixed cost of your own tool schemas","goal":"See, in real tokens, what you are paying on every single call before the model does any work.","steps":["Install the SDK: `pip install strands-agents strands-agents-tools`.","Build a minimal Strands agent with 3-5 tools (reuse your real tools, or the calculator/current_time tools shipped in strands-agents-tools).","Enable native Bedrock token counting on the model and inspect the accumulated usage after a single call. → Expect: a non-zero input token count that includes your tool schemas even on a trivial request.","Multiply that per-call fixed cost by your expected daily call volume. → Expect: a number that makes the 'tool tax' concrete rather than abstract."],"code":{"lang":"python","content":"from strands import Agent, tool\nfrom strands.models import BedrockModel\n\n@tool\ndef search_orders(order_id: str = \"\", status: str = \"\") -> str:\n    \"\"\"Search customer orders by id, date range, or status.\"\"\"\n    return f\"Searched orders with order_id={order_id!r} status={status!r}\"\n\n# add the rest of your real tools here\n\nmodel = BedrockModel(\n    model_id=\"us.anthropic.claude-sonnet-5\",\n    use_native_token_count=True,\n)\n\nagent = Agent(model=model, tools=[search_orders])\n\nresponse = agent(\"placeholder\")\n\ninput_tokens = response.metrics.accumulated_usage.get(\"inputTokens\", 0)\nprint(f\"Fixed per-call tool tax (this call's total input tokens): {input_tokens}\")\n"},"costImpact":"This number is paid on every call regardless of whether any tool is used. At scale it is often the single largest fixed cost in a custom agent, which is why Tab 5 (tool design) and Tab 7 (gateway patterns) exist.","globalNum":1}],"sources":[{"title":"Anthropic — Building effective agents","url":"https://www.anthropic.com/engineering/building-effective-agents","dateChecked":"2026-08-11","claim":"Distinction between workflows and agents, and the principle of adding complexity only when it demonstrably improves outcomes — the basis for this workshop's tiered, escalating structure."},{"title":"Strands Agents — Amazon Bedrock model provider","url":"https://strandsagents.com/docs/user-guide/concepts/model-providers/amazon-bedrock/","dateChecked":"2026-08-11","claim":"BedrockModel's use_native_token_count option and AgentResult.metrics.accumulated_usage as the source of real per-call token figures."},{"title":"Amazon Bedrock — Claude Sonnet 5 model card","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html","dateChecked":"2026-08-11","claim":"Bedrock model ID (anthropic.claude-sonnet-5) and cross-region inference profile IDs (us./eu./au./global.anthropic.claude-sonnet-5)."}]},{"id":"prompt-engineering","title":"Prompt Engineering — The Free Lever","tier":1,"tierLabel":"Text only, zero infrastructure","status":"stable","summary":"Before touching architecture, the words in your system prompt and output-format constraints already determine a large fraction of your token spend.","whyItMatters":"Output tokens are typically billed at a higher rate than input tokens, and a verbose or unconstrained system prompt is paid on every single call. This is the cheapest lever because it requires no new code paths, only better text.","concepts":[{"heading":"Output-length is a cost knob you control directly","body":"Unconstrained, a model will often over-explain. Explicit output-format instructions (structured JSON, a word/line cap, 'no preamble') reduce output tokens directly, and output tokens are the more expensive side of the ledger on most model pricing."},{"heading":"System prompt density vs. verbosity","body":"Every token in the system prompt is paid on every call. Long, narrative system prompts read well to a human reviewer but cost the same each invocation. Dense, structured instructions (short imperative bullets, not prose) typically compress the same guidance into fewer tokens without losing precision."},{"heading":"Few-shot examples are a cost/reliability tradeoff, not a free win","body":"Each example in a few-shot prompt is paid on every call, forever. They meaningfully improve reliability for ambiguous or format-sensitive tasks, but for well-specified tasks a strong zero-shot instruction is often just as reliable and strictly cheaper. Default to zero-shot; add examples only when zero-shot demonstrably fails."}],"exercises":[{"title":"Quantify the cost of an unconstrained vs. constrained output format","goal":"See directly how much an explicit output-format instruction saves in output tokens for the same task.","steps":["Pick a real task your agent performs (e.g. 'summarize this support ticket and extract the customer's request').","Build a Strands agent and run the task once with a bare instruction and no format constraint. Record output tokens from response.metrics.accumulated_usage. → Expect: a free-form paragraph response, often 150-400 output tokens.","Run the identical task again, adding: 'Respond with only a JSON object: {\"issue\": string, \"urgency\": \"low\"|\"medium\"|\"high\"}. No other text.' → Expect: output tokens drop substantially, often by more than half, with equal or better usability for downstream code.","Compare the two accumulated_usage.get(\"outputTokens\") values directly. → Expect: a concrete before/after number you can multiply by your call volume."],"code":{"lang":"python","content":"from strands import Agent\nfrom strands.models import BedrockModel\n\nagent = Agent(model=BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\"))\nticket = \"Customer says their order #4471 hasn't arrived after 2 weeks and they want a refund immediately.\"\n\n# Unconstrained\nresp_a = agent(f\"Summarize this support ticket and extract the customer's request: {ticket}\")\nprint(\"Unconstrained output tokens:\", resp_a.metrics.accumulated_usage.get(\"outputTokens\"))\n\n# Constrained -- fresh agent so the second call's usage isn't cumulative with the first\nagent2 = Agent(model=BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\"))\nresp_b = agent2(\n    f\"Ticket: {ticket}\\n\\n\"\n    'Respond with only a JSON object: {\"issue\": string, \"urgency\": \"low\"|\"medium\"|\"high\"}. '\n    \"No other text.\"\n)\nprint(\"Constrained output tokens:\", resp_b.metrics.accumulated_usage.get(\"outputTokens\"))\nprint(\"Constrained output:\", str(resp_b))\n"},"costImpact":"Output-token savings apply per call. At 10,000 calls/day, a drop from ~300 to ~40 output tokens is roughly 2.6M tokens/day saved, with no infrastructure change — just the instruction text.","globalNum":2},{"title":"Compress a narrative system prompt into a dense instruction set","goal":"Rewrite a prose-style system prompt as structured bullets and measure the token delta using native Bedrock token counting, without losing any instruction.","steps":["Take (or write) a system prompt in narrative style, e.g. 3-4 sentences of paragraph prose explaining the agent's role and constraints.","Build an agent with that system prompt and use_native_token_count=True, send one placeholder message, and read input tokens from accumulated_usage. → Expect: a baseline number that includes the system prompt.","Rewrite the same guidance as short imperative bullets, one instruction per line, removing connective prose. Build a second agent with the dense version and repeat.","Compare the two input token counts. → Expect: fewer tokens for materially the same instructions, since prose connectives ('In addition, you should also make sure to...') cost tokens without adding constraint."],"code":{"lang":"python","content":"from strands import Agent\nfrom strands.models import BedrockModel\n\nnarrative = (\n    \"You are a helpful assistant that works for our customer support team. \"\n    \"It is very important that you always remain polite and professional at all times, \"\n    \"and you should try your best to resolve the customer's issue. In addition, you should \"\n    \"also make sure to never make promises about refund timelines, since only a human agent \"\n    \"is authorized to do that, and you should always ask for the order number if the customer \"\n    \"has not already provided one.\"\n)\n\ndense = (\n    \"Role: customer support assistant.\\n\"\n    \"- Be polite and professional.\\n\"\n    \"- Never promise refund timelines (human-only).\\n\"\n    \"- Always request the order number if missing.\"\n)\n\nfor label, system_prompt in [(\"narrative\", narrative), (\"dense\", dense)]:\n    model = BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\", use_native_token_count=True)\n    agent = Agent(model=model, system_prompt=system_prompt)\n    response = agent(\"Hello\")\n    print(label, response.metrics.accumulated_usage.get(\"inputTokens\"))\n"},"costImpact":"System prompt tokens are paid on every call. A saving of even 30-40 tokens per call compounds linearly with volume and, unlike output-format savings, applies even to calls that produce no useful output (retries, errors, tool-only turns).","globalNum":3}],"sources":[{"title":"Anthropic — Prompt engineering overview","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview","dateChecked":"2026-08-11","claim":"General guidance on being explicit and specific in prompts, and on output formatting as a controllable variable."},{"title":"Anthropic — Reduce latency (applies to output-length control)","url":"https://platform.claude.com/docs/en/build-with-claude/reduce-latency","dateChecked":"2026-08-11","claim":"Output length is a primary driver of both latency and cost; constraining format is the direct lever."},{"title":"Strands Agents — Amazon Bedrock model provider (Token Counting section)","url":"https://strandsagents.com/docs/user-guide/concepts/model-providers/amazon-bedrock/","dateChecked":"2026-08-11","claim":"use_native_token_count=True and response.metrics.accumulated_usage as the source of real inputTokens/outputTokens figures used in both exercises."}]},{"id":"context-memory-engineering","title":"Context & Memory Engineering","tier":2,"tierLabel":"Code you write, no new services required","status":"stable","summary":"There is no /compact button in your own agent loop. Context grows every turn unless you explicitly design what gets kept, summarized, or dropped.","whyItMatters":"Every prior turn you keep re-sends its full token cost on every subsequent call. Left unmanaged, a long-running agent's per-call cost grows linearly (or worse) with conversation length, and eventually exceeds the context window entirely.","concepts":[{"heading":"Sliding windows are the simplest policy, and often good enough","body":"Keep the system prompt plus the last N turns verbatim, drop everything older. Cheap to implement, no summarization cost, but loses information older than the window — fine for short-horizon tasks, wrong for anything that needs long-term coherence."},{"heading":"Programmatic summarization replaces the human hitting /compact","body":"When a conversation crosses a token threshold, run a (typically cheaper-model) summarization pass over the older turns and replace them with the summary. This is the direct code equivalent of Claude Code's /compact, except you decide the trigger threshold and the summarization prompt."},{"heading":"Structured memory separates 'what happened' from 'what's true'","body":"Episodic memory (a log of past turns/events) and semantic memory (durable facts distilled from those events, e.g. user preferences) are different stores with different costs. Retrieving a small set of relevant facts from a semantic store is far cheaper than re-sending an entire episodic history and searching it implicitly via the model's attention."},{"heading":"Retrieval instead of stuffing","body":"Rather than keeping full history in-context, index it (vector store, keyword index, or even a simple recency+relevance heuristic) and retrieve only what's relevant to the current turn. This trades a retrieval step for a much smaller context payload on every call."}],"exercises":[{"title":"Cap conversation history with Strands' sliding-window conversation manager","goal":"Bound context growth using Strands' built-in conversation manager instead of hand-rolling a token-budget class.","steps":["Attach a SlidingWindowConversationManager to a Strands agent with a fixed window_size and should_truncate_results=True.","Run a long synthetic conversation (20+ turns) through the agent. → Expect: once the window fills, the manager trims oldest messages automatically -- total input tokens per call plateau instead of growing linearly with turn count.","Send a tool call that returns a very large result. → Expect: should_truncate_results causes the manager to preserve only the first/last 200 characters of old tool results before evicting them, rather than blowing the budget on one oversized result."],"code":{"lang":"python","content":"from strands import Agent\nfrom strands.agent.conversation_manager import SlidingWindowConversationManager\nfrom strands.models import BedrockModel\n\nconversation_manager = SlidingWindowConversationManager(\n    window_size=20,             # max messages kept in history\n    should_truncate_results=True,\n    pin_first=1,                 # keep the very first message (e.g. task framing) pinned\n)\n\nagent = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-haiku-4-5-20251001-v1:0\"),\n    conversation_manager=conversation_manager,\n)\n\nfor turn in synthetic_turns:  # 20+ turns of a long-running task\n    response = agent(turn)\n    print(response.metrics.accumulated_usage.get(\"inputTokens\"))\n"},"costImpact":"Without a cap, a 50-turn conversation can cost 10-20x more per call by the end than at the start, purely from re-sending growing history. window_size bounds this to a flat cost regardless of session length, and should_truncate_results prevents a single huge tool result from spiking one call.","globalNum":4},{"title":"Enable proactive compaction to replicate /compact automatically","goal":"Replicate /compact: instead of waiting for an overflow error, compress context proactively once it crosses a percentage of the context window, using Strands' built-in proactive_compression option.","steps":["Set proactive_compression=True on the same SlidingWindowConversationManager (default threshold: compress at 70% of context window used), or pass a specific ratio.","Optionally set per_turn=True so management runs before every model call rather than only at the end of a loop -- important for agents that call many tools per turn (e.g. browsing with screenshots).","Run the same long synthetic conversation. → Expect: input tokens per call show a repeating sawtooth pattern -- climbing, then dropping sharply once the 70% threshold triggers a compression pass -- instead of climbing without bound.","Compare against reduce_context's reactive path: force a context-window overflow and confirm the manager also recovers by truncating tool results first, only falling back to trimming messages if that's not enough."],"code":{"lang":"python","content":"from strands import Agent\nfrom strands.agent.conversation_manager import SlidingWindowConversationManager\nfrom strands.models import BedrockModel\n\nconversation_manager = SlidingWindowConversationManager(\n    window_size=40,\n    should_truncate_results=True,\n    proactive_compression=True,   # compress at 70% of context window by default\n    per_turn=True,                 # re-check before every model call, not just at loop end\n)\n\nagent = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-haiku-4-5-20251001-v1:0\"),\n    conversation_manager=conversation_manager,\n)\n\nfor turn in synthetic_turns:\n    response = agent(turn)\n    print(response.metrics.accumulated_usage.get(\"inputTokens\"))\n"},"costImpact":"Proactive compression has a one-time cost each time it fires, but converts an unbounded linear growth curve into a repeating sawtooth capped near the 70% context-window threshold -- the same shape you'd see monitoring Claude Code's own /usage across a /compact event, produced automatically instead of by hand-rolled summarization code.","globalNum":5}],"sources":[{"title":"Anthropic — Context engineering for AI agents","url":"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents","dateChecked":"2026-08-11","claim":"Context is a finite, degrading resource; compaction and structured note-taking/memory are named strategies for managing it across long agent sessions."},{"title":"Strands Agents — SlidingWindowConversationManager API reference","url":"https://strandsagents.com/docs/api/python/strands.agent.conversation_manager.sliding_window_conversation_manager/","dateChecked":"2026-08-11","claim":"window_size, should_truncate_results, per_turn, pin_first, and proactive_compression parameters, including the default 70% compression threshold and the reactive reduce_context truncate-then-trim recovery order."}]},{"id":"model-engineering-routing","title":"Model Engineering & Routing","tier":3,"tierLabel":"Code you write, builds on context signals from Tier 2","status":"stable","summary":"The programmatic version of /model: deciding, per task or per step, which model tier handles a request — instead of one model handling everything at the same price.","whyItMatters":"Model price differences between tiers are often 5-10x. Routing simple, high-confidence steps to a cheap model and reserving expensive models for genuinely hard steps can cut aggregate cost sharply without materially hurting quality.","concepts":[{"heading":"Static routing by task type","body":"The simplest form: classify the incoming task (by keyword, regex, or a cheap classifier call) and route to a fixed model per category. E.g. intent classification -> Haiku, complex multi-step reasoning -> Sonnet/Opus. No feedback loop, but simple to reason about and audit."},{"heading":"Cascades: try cheap, escalate on failure","body":"Run the cheap model first. If its output fails a validation check (schema mismatch, low self-reported confidence, a downstream verifier rejecting it), re-run the same request on a more capable model. Pays the cheap-model cost on every request but the expensive-model cost only on the fraction that need it."},{"heading":"Per-step routing within a single agent loop","body":"A multi-step agent doesn't need the same model for every step. Planning/decomposition may warrant a stronger model; routine tool-call formatting or extraction from already-retrieved text often does not. This requires the agent's orchestration code to make a model choice at each step rather than fixing one model for the whole run."},{"heading":"Agents-as-Tools: routing as delegation, not just classification","body":"Strands' Agents-as-Tools pattern wraps a specialized Agent in a @tool function so an orchestrator agent can call it like any other tool. This is model routing in a more general form: instead of a single classify-then-pick-model step, the orchestrator (on a capable model) decides per request which specialist agent (each with its own, possibly cheaper, model) to consult -- and can consult more than one, or none, depending on the request."}],"exercises":[{"title":"Build a two-tier cascade with an explicit escalation condition","goal":"Route a classification task to a cheap model by default, and escalate to a stronger model only when the cheap model's output fails validation.","steps":["Define a strict output schema for the task (e.g. a JSON object with a required enum field) and a Strands agent per model tier.","Call the cheap-tier agent first. Attempt to parse/validate its output against the schema.","If validation fails, re-run the identical prompt on the strong-tier agent. → Expect: the vast majority of well-formed inputs resolve on the cheap model; only malformed or ambiguous cases escalate.","Log which tier handled each request using each agent's own accumulated_usage. → Expect: over a batch of real inputs, an escalation rate well under 50%, ideally under 15-20% for a well-specified task."],"code":{"lang":"python","content":"import json\nfrom strands import Agent\nfrom strands.models import BedrockModel\n\nSCHEMA_PROMPT = (\n    'Respond with only JSON: {\"category\": \"billing\"|\"technical\"|\"other\", \"confidence\": \"high\"|\"low\"}'\n)\n\ncheap_agent = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-haiku-4-5-20251001-v1:0\"),\n    callback_handler=None,\n)\nstrong_agent = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\"),\n    callback_handler=None,\n)\n\ndef classify_ticket(text):\n    prompt = f\"Ticket: {text}\\n\\n{SCHEMA_PROMPT}\"\n\n    cheap_response = cheap_agent(prompt)\n    try:\n        result = json.loads(str(cheap_response))\n        if result.get(\"confidence\") == \"high\" and result.get(\"category\") in {\"billing\", \"technical\", \"other\"}:\n            return result[\"category\"], \"haiku\"\n    except (json.JSONDecodeError, KeyError):\n        pass\n\n    strong_response = strong_agent(prompt)\n    result = json.loads(str(strong_response))\n    return result[\"category\"], \"sonnet-escalated\"\n"},"costImpact":"If 80% of requests resolve on the cheap tier and only 20% escalate, and the strong model costs 8x the cheap model per call, blended cost is roughly (0.8 x 1) + (0.2 x 8) = 2.4x the cheap-only cost -- versus 8x if every request had gone straight to the strong model. The escalation rate is the number to watch and tune.","globalNum":6},{"title":"Route to a specialist agent with Agents-as-Tools instead of a fixed cascade","goal":"Let an orchestrator agent decide, per request, which cheaper specialist agent to delegate to -- rather than a single always-classify-then-escalate rule.","steps":["Build two specialist agents on the cheap model tier, each with a narrow system prompt and only the tools it needs.","Wrap each specialist in a @tool function that calls it and returns its response as a string.","Give an orchestrator agent (on the stronger model tier) only the two specialist tools -- not the underlying work directly.","Send a request that only needs one specialist. → Expect: the orchestrator calls only the relevant specialist tool; the other specialist's model is never invoked, so its cost is zero for that request."],"code":{"lang":"python","content":"from strands import Agent, tool\nfrom strands.models import BedrockModel\n\ncheap_model = BedrockModel(model_id=\"us.anthropic.claude-haiku-4-5-20251001-v1:0\")\n\nbilling_agent = Agent(\n    model=cheap_model,\n    system_prompt=\"You answer billing and invoice questions only.\",\n)\ntechnical_agent = Agent(\n    model=cheap_model,\n    system_prompt=\"You answer technical/product usage questions only.\",\n)\n\n@tool\ndef billing_specialist(query: str) -> str:\n    \"\"\"Answer a billing or invoice related question.\"\"\"\n    return str(billing_agent(query))\n\n@tool\ndef technical_specialist(query: str) -> str:\n    \"\"\"Answer a technical or product usage question.\"\"\"\n    return str(technical_agent(query))\n\norchestrator = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\"),\n    tools=[billing_specialist, technical_specialist],\n)\n\nresult = orchestrator(\"Why was I charged twice this month?\")\n"},"costImpact":"The strong-tier orchestrator only pays for the tool-call decision, not for doing the underlying work -- the actual answer is generated by a cheap-tier specialist. Unused specialists cost nothing per request, unlike a fixed pipeline that always runs every stage.","globalNum":7}],"sources":[{"title":"Anthropic — Model selection / pricing guidance","url":"https://platform.claude.com/docs/en/about-claude/models/overview","dateChecked":"2026-08-11","claim":"Relative price/capability tiers across model families, the basis for cascade and static-routing cost math."},{"title":"Anthropic — Building effective agents (workflow patterns)","url":"https://www.anthropic.com/engineering/building-effective-agents","dateChecked":"2026-08-11","claim":"Routing as a named workflow pattern: classifying an input and directing it to a specialized downstream path."},{"title":"Strands Agents 1.0 — Agents-as-Tools","url":"https://strandsagents.com/blog/strands-agents-1-0/","dateChecked":"2026-08-11","claim":"Agents-as-Tools pattern: wrapping a specialized Agent in a @tool function so an orchestrator can delegate to it, including the exact code shape used in this tab's second exercise."},{"title":"Amazon Bedrock — Claude Haiku 4.5 model card","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-4-5.html","dateChecked":"2026-08-11","claim":"Bedrock model ID and cross-region inference profile ID for Claude Haiku 4.5, including the versioned suffix format (-20251001-v1:0)."}]},{"id":"tool-design-progressive-disclosure","title":"Tool Design Economics & Progressive Disclosure","tier":4,"tierLabel":"Design decisions, some code","status":"stable","summary":"Every tool schema you register is paid for on every single call, whether the model uses it or not. Progressive disclosure means the model only sees a tool's full definition when it's actually about to use it.","whyItMatters":"Tab 1's exercise showed the per-call tax of a handful of tools. At real scale (dozens of MCP servers, hundreds of tools) that tax alone can exceed the cost of the actual work being done.","concepts":[{"heading":"Minimize the tool surface, not just the schema verbosity","body":"Fewer, more general tools (e.g. one `run_query` tool with parameters) usually beat many narrow tools (`get_user`, `get_order`, `get_invoice`, ...) for token cost, provided the model can still express the same range of actions. Consolidation is the first lever, before optimizing individual schema wording."},{"heading":"Progressive disclosure: show a menu, not a manual","body":"Instead of sending full input_schema for every tool on every call, send a short list of tool names + one-line descriptions upfront, and only expand a tool's full schema into context when the model signals intent to use it (a two-step call, or a dedicated 'get tool details' meta-tool). This is the same principle behind Claude Code's Skills: full detail loaded only on demand."},{"heading":"Namespacing and grouping reduce cognitive and token load together","body":"Grouping related tools under a shared prefix (`db.query`, `db.insert`, `slack.post_message`) helps the model pick faster and lets you disclose by group rather than by individual tool -- 'load all db.* tool schemas' is one disclosure decision instead of many."}],"exercises":[{"title":"Convert an always-loaded tool list into a two-step progressive disclosure pattern","goal":"Measure the token savings from sending short tool summaries by default and only expanding full schemas for tools the model actually intends to use.","steps":["Build a Strands agent with your real tools (5-10 of them) registered normally and record its per-call input tokens as the baseline (reuse the native-token-count pattern from Tab 1).","Build a 'catalog' meta-tool whose description lists all available tool names and one-line summaries, plus a single `call_tool(name, arguments)` dispatch meta-tool that looks up the named function and invokes it directly.","Register only the two meta-tools with the agent -- never register the real tools' schemas at all. → Expect: fixed per-call token cost proportional to two small meta-tool schemas plus one line per catalog entry, not tool count x full schema size.","Run a task that needs one of the underlying tools. → Expect: the model calls list_available_tools, then call_tool(name=..., arguments=...) -- the full input_schema of search_orders or issue_refund is never sent to the model at any point, since call_tool's own schema (name: str, arguments: dict) is all that's ever transmitted."],"code":{"lang":"python","content":"from strands import Agent, tool\nfrom strands.models import BedrockModel\n\n# Real tool implementations -- plain functions, not registered with the agent directly.\ndef search_orders(order_id: str = \"\", status: str = \"\") -> str:\n    \"\"\"Search orders by id, date, or status.\"\"\"\n    return f\"Searched orders: order_id={order_id!r} status={status!r}\"\n\ndef issue_refund(order_id: str, amount: float) -> str:\n    \"\"\"Issue a refund for an order.\"\"\"\n    return f\"Refunded {amount} for order {order_id}\"\n\n# ... rest of your real tool functions, undecorated\n\nALL_TOOLS = {\"search_orders\": search_orders, \"issue_refund\": issue_refund}\n\n@tool\ndef list_available_tools() -> list:\n    \"\"\"Return a catalog of available tool names with one-line summaries.\n    Call call_tool(name, arguments) to invoke one.\"\"\"\n    return [{\"name\": name, \"summary\": fn.__doc__} for name, fn in ALL_TOOLS.items()]\n\n@tool\ndef call_tool(name: str, arguments: dict) -> str:\n    \"\"\"Invoke a named tool from the catalog with the given keyword arguments.\"\"\"\n    if name not in ALL_TOOLS:\n        return f\"Unknown tool: {name}. Call list_available_tools() first.\"\n    return ALL_TOOLS[name](**arguments)\n\n# The agent only ever sees these two small, fixed meta-tool schemas.\nagent = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\"),\n    tools=[list_available_tools, call_tool],\n)\n"},"costImpact":"For a 50-tool agent where each full schema averages 300 tokens, registering all 50 directly costs ~15,000 tokens/call fixed. The catalog + call_tool dispatch pattern costs roughly 300-500 tokens/call total, regardless of how many underlying tools exist, since only the two meta-tool schemas are ever transmitted -- the real tools' schemas never enter the model's context at all.","globalNum":8}],"sources":[{"title":"Anthropic — Claude Code Skills (progressive disclosure pattern)","url":"https://code.claude.com/docs/en/skills","dateChecked":"2026-08-11","claim":"Skills load only on demand rather than being always present in context -- the source pattern this tab's technique generalizes from Claude Code to custom agent tool design."},{"title":"Anthropic — Building effective agents (tool design section)","url":"https://www.anthropic.com/engineering/building-effective-agents","dateChecked":"2026-08-11","claim":"Tool design as a first-class engineering concern, including keeping tool surfaces minimal and well-documented."},{"title":"Strands Agents — Agent API reference (tools parameter)","url":"https://strandsagents.com/docs/api/python/strands.agent.agent/","dateChecked":"2026-08-11","claim":"The @tool decorator and the tools constructor parameter accepting a list of registered functions -- the basis for keeping only meta-tools registered directly with the agent."}]},{"id":"programmatic-tool-calling","title":"Programmatic Tool Calling","tier":5,"tierLabel":"Orchestration code, builds directly on Tier 4","status":"stable","summary":"Instead of one tool call per model turn, let the model emit code that orchestrates several tool calls in a single shot -- collapsing N round-trips into one.","whyItMatters":"Each sequential tool-call turn re-pays the full context (system prompt, tool catalog, growing history) on every round-trip. Reducing turn count is a direct multiplier on the fixed per-call costs established in Tabs 1 and 5.","concepts":[{"heading":"The round-trip tax","body":"A task needing 5 sequential tool calls in the traditional model normally costs 5 full round-trips: 5x the system prompt, 5x the tool schema tax, 5x the growing conversation history. If those 5 calls don't actually depend on the model reasoning between each one, that's pure overhead."},{"heading":"Code as the orchestration layer","body":"Give the model a code-execution tool (a sandboxed interpreter) and let it write a short script that calls your other tools/functions directly, loops, branches, and aggregates results -- then returns just the final result to the conversation. The model reasons once, writes orchestration logic once, and only the net result re-enters context."},{"heading":"When this helps and when it doesn't","body":"This pays off when tool calls are largely mechanical (fetch these 10 records, filter, sum) and the model doesn't need to see each intermediate result to decide the next step. It does NOT help when the model genuinely needs to reason about tool call N's result before deciding what to call next -- that dependency chain still needs real round-trips."}],"exercises":[{"title":"Replace 5 sequential tool-call turns with one code-execution turn","goal":"Compare round-trip count and total tokens for a mechanically decomposable task done the traditional way vs. via code orchestration.","steps":["Define a task requiring several independent lookups plus aggregation (e.g. 'get the total order value for customers 101, 102, 103, 104, 105').","Build a Strands agent with only a get_order_total(customer_id) @tool registered (no sandbox). Ask it to fetch and sum all 5 totals. → Expect: the model calls get_order_total 5 separate times, one tool round-trip each, then a final turn to sum and answer -- 6 total model turns, tracked via response.metrics accumulated across the invocation.","Build a second agent with Strands' built-in sandboxed shell tool added instead of the per-lookup tool. Ask the model to compute the same sum by running one Python one-liner in the shell. → Expect: 1-2 model turns total (write the command, return the result); the arithmetic happens inside the sandbox execution in a single call, never as 5 separate tool round-trips.","Compare each response's accumulated_usage.get(\"inputTokens\") and .get(\"outputTokens\") across both approaches for the identical task. → Expect: the code-orchestration version uses a small fraction of the tokens, roughly proportional to (1 / number_of_calls_collapsed)."],"code":{"lang":"python","content":"from strands import Agent, tool\nfrom strands.models import BedrockModel\nfrom strands.vended_tools.shell import shell\n\nORDER_TOTALS = {101: 42.50, 102: 17.00, 103: 88.25, 104: 5.10, 105: 63.40}\n\n@tool\ndef get_order_total(customer_id: int) -> float:\n    \"\"\"Return the total order value for a customer id.\"\"\"\n    return ORDER_TOTALS.get(customer_id, 0.0)\n\nmodel = BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\")\n\n# Traditional: one tool round-trip per customer id, plus a final summarizing turn.\ntraditional_agent = Agent(model=model, tools=[get_order_total])\ntraditional_response = traditional_agent(\n    \"Get the order total for customers 101, 102, 103, 104, 105 and tell me the sum.\"\n)\nprint(\"traditional tokens:\", traditional_response.metrics.accumulated_usage)\n\n# Code-execution: the model writes one script that does the loop and sum itself,\n# inside Strands' sandboxed shell tool, in a single round-trip.\ncode_agent = Agent(model=model, tools=[shell])\ncode_response = code_agent(\n    \"Run this Python one-liner in the shell and report only the final number: \"\n    \"python3 -c \\\"print(sum([42.50, 17.00, 88.25, 5.10, 63.40]))\\\"\"\n)\nprint(\"code-execution tokens:\", code_response.metrics.accumulated_usage)\n"},"costImpact":"For an N-step mechanical task, traditional round-trips cost roughly N x (fixed context per call). Code orchestration costs roughly 1-2 x (fixed context per call) plus the sandbox execution cost, which is typically far cheaper than additional model round-trips. The savings scale with N -- bigger fan-out, bigger win.","globalNum":9}],"sources":[{"title":"Anthropic — Code execution tool","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/code-execution-tool","dateChecked":"2026-08-11","claim":"A sandboxed code-execution tool lets the model run code, including orchestrating other tool/function calls, within a single turn rather than one round-trip per call."},{"title":"Anthropic — Tool use overview","url":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview","dateChecked":"2026-08-11","claim":"Baseline mechanics of tool-call round-trips this tab's pattern is optimizing against."},{"title":"Strands Agents — vended_tools.shell.shell API reference","url":"https://strandsagents.com/docs/api/python/strands.vended_tools.shell.shell/","dateChecked":"2026-08-11","claim":"The shell tool used in this exercise: a sandbox-routed tool that executes commands (including one-off Python via python3 -c) inside the agent's configured Sandbox, defaulting to NotASandboxLocalEnvironment when no sandbox is passed."}]},{"id":"gateway-patterns","title":"Gateway Patterns for Tool Loading","tier":6,"tierLabel":"Infrastructure -- a service you stand up","status":"stable","summary":"Progressive disclosure (Tab 5) solved this for one agent with a fixed tool list. At scale -- dozens of MCP servers, hundreds of tools across a fleet of agents -- static loading is itself the bottleneck, and you need a gateway that resolves and loads tool definitions on demand.","whyItMatters":"Connecting an agent to many MCP servers directly means loading every server's full tool catalog on every call, even though a given task might use tools from only one or two of them. A gateway centralizes discovery so agents load only what they need, when they need it.","concepts":[{"heading":"The gateway sits between the agent and many tool sources","body":"Rather than an agent connecting directly to N MCP servers and receiving all N catalogs, it connects to one gateway. The gateway indexes every downstream server's tools and exposes a search/discovery interface -- the agent asks 'what tools handle X' and gets back only relevant results, not everything."},{"heading":"Tool search as a first-class capability, not an afterthought","body":"A gateway's core value is a search tool over tool metadata: given a natural-language description of what's needed, return the matching tool(s) and only then load their full schema into context. This is the fleet-scale version of the single-agent progressive disclosure in Tab 5."},{"heading":"Centralized auth, policy, and rate limiting","body":"A gateway is also the natural place to enforce which agents can reach which downstream tools, apply rate limits per tool/server, and centralize credential management -- so individual agents don't each need their own connection and auth logic to every MCP server, which would multiply both complexity and standing connection overhead."}],"exercises":[{"title":"Stand up a minimal tool-search gateway over two mock MCP-style tool sources","goal":"Demonstrate the discovery-then-load pattern end-to-end: an agent asks a gateway for relevant tools by description, gets back a short list, and only then requests full schemas for the ones it needs.","steps":["Define two mock 'downstream servers,' each with 3-4 tools and a one-line description per tool (simulating two MCP servers with disjoint catalogs).","Build a gateway search function that takes a free-text query and returns the top-matching tool names + descriptions across both servers (simple keyword match is enough to demonstrate the pattern; a real gateway would use embeddings).","Give the agent only the gateway's `search_tools(query)` and `get_tool_schema(name)` meta-tools -- not the full catalogs of either downstream server.","Run a task that only needs one server's tools. → Expect: search_tools returns matches from the relevant server only; get_tool_schema is called only for the 1-2 tools actually used; the other server's tool definitions never enter context at all."],"code":{"lang":"python","content":"from strands import Agent, tool\nfrom strands.models import BedrockModel\n\nDOWNSTREAM_SERVERS = {\n    \"crm\": {\n        \"get_contact\": \"Look up a CRM contact by email or id.\",\n        \"update_contact\": \"Update fields on a CRM contact.\",\n        \"list_deals\": \"List open deals for a contact.\",\n    },\n    \"billing\": {\n        \"get_invoice\": \"Fetch an invoice by id.\",\n        \"issue_refund\": \"Issue a refund against an invoice.\",\n        \"list_invoices\": \"List invoices for a customer.\",\n    },\n}\n\n@tool\ndef search_tools(query: str) -> list:\n    \"\"\"Search across all downstream servers for tools matching a free-text query.\n    Call get_tool_schema(server, name) on a match before invoking it.\"\"\"\n    query_terms = query.lower().split()\n    matches = []\n    for server, tools in DOWNSTREAM_SERVERS.items():\n        for name, desc in tools.items():\n            if any(term in desc.lower() or term in name for term in query_terms):\n                matches.append({\"server\": server, \"name\": name, \"description\": desc})\n    return matches\n\n@tool\ndef get_tool_schema(server: str, name: str) -> str:\n    \"\"\"Return the description for a specific tool on a specific downstream server.\"\"\"\n    return DOWNSTREAM_SERVERS.get(server, {}).get(name, \"Unknown tool\")\n\n# The agent only ever sees these two gateway meta-tools -- never the 6 real\n# tool schemas across both downstream servers.\nagent = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\"),\n    tools=[search_tools, get_tool_schema],\n)\n\nresponse = agent(\"I need to refund a customer's invoice, what tool should I use?\")\n# -> search_tools(\"refund a customer's invoice\") returns only billing.issue_refund\n#    and billing.get_invoice; the crm.* tools never surface for this request.\n"},"costImpact":"Without a gateway, connecting to both servers directly means loading 6+ full tool schemas (both servers) on every call regardless of task. With gateway-mediated search, only the 1-2 relevant schemas for the matched server are loaded -- the unused server's entire catalog costs zero tokens for that task.","globalNum":10}],"sources":[{"title":"Amazon Bedrock AgentCore — Gateway","url":"https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html","dateChecked":"2026-08-11","claim":"AgentCore Gateway pattern: centralizing tool discovery and access across multiple backend targets for agents, with search over available tools."},{"title":"Anthropic — MCP tool search / deferred tool loading pattern","url":"https://code.claude.com/docs/en/mcp","dateChecked":"2026-08-11","claim":"Claude Code's own MCP tool-search deferred-loading mechanism is the single-client instance of the same discovery-then-load principle a gateway applies at fleet scale."},{"title":"Strands Agents — Agent API reference (tools parameter)","url":"https://strandsagents.com/docs/api/python/strands.agent.agent/","dateChecked":"2026-08-11","claim":"The @tool decorator and Agent(tools=[...]) constructor parameter used to register only the two gateway meta-tools with the agent."}]},{"id":"hooks-lifecycle","title":"Hooks & Lifecycle Interception","tier":7,"tierLabel":"Guardrail code -- the programmatic equivalent of a human watching the session","status":"stable","summary":"Claude Code's hooks let you intercept tool calls with a shell script. A custom agent needs the same interception points -- pre-call and post-call hooks -- built directly into its own loop, since no human is present to notice a problem and stop it.","whyItMatters":"The single biggest unattended-agent cost risk is a loop that keeps calling tools (and paying for tokens) without making progress. Lifecycle hooks are where you enforce budgets, block dangerous or wasteful calls, and log for later cost attribution -- all things a human supervising Claude Code does implicitly.","concepts":[{"heading":"Pre-call hooks: validate and block before spending tokens on execution","body":"Before a tool call actually executes, a pre-call hook can reject it (wrong arguments, disallowed target, budget already exceeded) and feed a reason back to the model -- the same role as Claude Code's PreToolUse hook returning exit code 2, but implemented as a function call in your own orchestration code rather than a subprocess."},{"heading":"Post-call hooks: shrink what re-enters context, log what happened","body":"After a tool executes, a post-call hook can truncate or summarize a huge result before it's added to conversation history (mirroring Claude Code's filter-test-output pattern), and unconditionally log token counts, latency, and cost per call for later analysis -- this is what feeds Tab 10's observability."},{"heading":"Circuit breakers replace the human hitting Escape","body":"A hard cap on consecutive tool calls without new information, a maximum total token spend per task, or a maximum wall-clock time per task are the code equivalent of a person noticing a session has gone in circles. Without an explicit circuit breaker, a buggy agent loop can run (and bill) indefinitely."}],"exercises":[{"title":"Implement a token-budget hook and a repeat-call circuit breaker with Strands HookProvider","goal":"Build two guardrails using Strands' real hook events instead of a hand-rolled pre-call wrapper: reject tool calls once a token budget is exhausted, and halt after too many identical consecutive calls.","steps":["Implement a HookProvider that registers on BeforeInvocationEvent (to reset the repeat-call counter each turn) and BeforeToolCallEvent (to block tool execution before it happens).","After each agent(...) call in your orchestration loop, read response.metrics.accumulated_usage and feed the running total into the guardrail object.","In the BeforeToolCallEvent callback, check that running total against a fixed budget; if over, set event.cancel_tool to a message explaining why. → Expect: the model receives that message as the tool's result and is forced toward a conclusion, rather than the loop silently continuing to spend.","In the same callback, track consecutive calls to the same tool with identical arguments; if a threshold is exceeded, also set event.cancel_tool. → Expect: a deliberately-triggered retry loop (a tool that always errors, which the model keeps retrying identically) stops after the threshold instead of running unbounded, matching the pattern in Strands' own 'Limit Tool Counts' cookbook recipe."],"code":{"lang":"python","content":"from threading import Lock\nfrom strands import Agent\nfrom strands.hooks import HookProvider, HookRegistry, BeforeInvocationEvent, BeforeToolCallEvent\nfrom strands.models import BedrockModel\n\nclass AgentGuardrails(HookProvider):\n    \"\"\"Enforces a token budget and a repeat-call circuit breaker across a session.\"\"\"\n\n    def __init__(self, max_tokens: int = 50_000, max_repeat_calls: int = 5):\n        self.max_tokens = max_tokens\n        self.max_repeat_calls = max_repeat_calls\n        self.tokens_spent = 0\n        self.last_signature = None\n        self.repeat_count = 0\n        self._lock = Lock()\n\n    def register_hooks(self, registry: HookRegistry) -> None:\n        registry.add_callback(BeforeInvocationEvent, self._reset_repeat_counter)\n        registry.add_callback(BeforeToolCallEvent, self._guard_tool_call)\n\n    def record_usage(self, accumulated_usage: dict) -> None:\n        \"\"\"Call this with response.metrics.accumulated_usage after each agent(...) call.\"\"\"\n        with self._lock:\n            self.tokens_spent = accumulated_usage.get(\"inputTokens\", 0) + accumulated_usage.get(\"outputTokens\", 0)\n\n    def _reset_repeat_counter(self, event: BeforeInvocationEvent) -> None:\n        with self._lock:\n            self.repeat_count = 0\n            self.last_signature = None\n\n    def _guard_tool_call(self, event: BeforeToolCallEvent) -> None:\n        tool_name = event.tool_use[\"name\"]\n\n        if self.tokens_spent >= self.max_tokens:\n            event.cancel_tool = (\n                f\"Budget exceeded: {self.tokens_spent} tokens spent, limit {self.max_tokens}. \"\n                f\"Conclude with your best answer now.\"\n            )\n            return\n\n        signature = (tool_name, tuple(sorted(event.tool_use[\"input\"].items())))\n        with self._lock:\n            if signature == self.last_signature:\n                self.repeat_count += 1\n            else:\n                self.repeat_count = 0\n                self.last_signature = signature\n\n        if self.repeat_count >= self.max_repeat_calls:\n            event.cancel_tool = (\n                f\"Circuit breaker: '{tool_name}' called with identical arguments \"\n                f\"{self.max_repeat_calls} times in a row. Stop retrying this tool.\"\n            )\n\nguardrails = AgentGuardrails(max_tokens=50_000, max_repeat_calls=5)\n\nagent = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\"),\n    hooks=[guardrails],\n)\n\nfor user_turn in conversation_turns:\n    response = agent(user_turn)\n    guardrails.record_usage(response.metrics.accumulated_usage)\n"},"costImpact":"A single stuck agent instance without a circuit breaker can run for hours, paying for every retried call. At even a modest 2,000 tokens/call and one call every few seconds, an unbounded loop left overnight can outspend an entire day's normal, healthy task volume. Implementing the repeat-call check via real hook events (rather than wrapping every tool call by hand) means the guardrail applies uniformly to every tool the agent has, including ones added later.","globalNum":11}],"sources":[{"title":"Claude Code — Hooks reference","url":"https://code.claude.com/docs/en/hooks","dateChecked":"2026-08-11","claim":"PreToolUse/PostToolUse lifecycle events, exit-code-2 blocking semantics, and JSON stdin schema -- the reference implementation this tab's guardrail pattern generalizes to custom agent code."},{"title":"Strands Agents — Hooks concept guide","url":"https://strandsagents.com/docs/user-guide/concepts/agents/hooks/","dateChecked":"2026-08-11","claim":"BeforeToolCallEvent.cancel_tool, BeforeInvocationEvent, and the HookProvider/register_hooks pattern, including the documented 'Limit Tool Counts' cookbook recipe this exercise adapts into a token-budget-aware guardrail."},{"title":"Strands Agents — Hook events API reference (strands.hooks.events)","url":"https://strandsagents.com/docs/api/python/strands.hooks.events/","dateChecked":"2026-08-11","claim":"Confirms BeforeToolCallEvent's documented attributes (selected_tool, tool_use, invocation_state, cancel_tool) and AfterModelCallEvent's documented attributes (invocation_state, stop_response, exception, retry) -- AfterModelCallEvent does not expose a usage field, which is why this exercise reads token usage from response.metrics.accumulated_usage between agent calls instead."}]},{"id":"caching-strategies","title":"Caching Strategies","tier":8,"tierLabel":"Structural -- most effective once prompt (Tier 1) and context (Tier 2) shape is stable","status":"stable","summary":"Three distinct caching layers apply to a custom agent: prompt caching (structural, prefix-dependent), semantic/FAQ caching (skip the model call entirely for repeat questions), and tool-result caching (skip re-executing deterministic calls).","whyItMatters":"Caching doesn't reduce what a single novel call costs -- it reduces how often you pay full price at all. Placed after prompt and context design because caching effectiveness depends directly on choices made in those earlier tabs.","concepts":[{"heading":"Prompt caching depends on prefix stability","body":"Providers cache a prefix of the input (system prompt, tool definitions, static context) if it's byte-identical across calls and marked as cacheable. This means static content must come first and stay first -- if Tab 2's system prompt or Tab 5's tool catalog changes shape between calls, cache hits drop. Ordering discipline established in earlier tabs is what makes this tab's technique work at all."},{"heading":"Semantic/FAQ caching skips the model call entirely","body":"For a support or Q&A-style agent, many incoming questions are semantically identical to ones already answered. Embedding the incoming query and checking similarity against a cache of (query embedding, prior answer) pairs can let you return a cached answer with zero model call for a meaningful fraction of traffic -- at the cost of a small embedding-similarity lookup."},{"heading":"Tool-result caching for deterministic calls","body":"If a tool call is a pure function of its arguments (a database lookup, a calculation, an unchanging reference lookup), cache the result keyed by arguments. This avoids both the downstream tool's execution cost and, more importantly for tokenomics, avoids the model needing another round-trip to receive a result it already has."}],"exercises":[{"title":"Enable prompt caching and measure the cache-hit discount directly","goal":"Mark the static portion of a request as cacheable, run the same prefix twice, and compare cost/latency reported for the cached vs. uncached call.","steps":["Take a system prompt you've kept stable (per Tab 2's guidance) and long enough to exceed the model's minimum cacheable token threshold (4,096 tokens per checkpoint for both Claude Sonnet 5 and Claude Haiku 4.5 on Bedrock, up to 4 checkpoints per request), and mark it with a cache checkpoint using Strands' SystemContentBlock.","Make a first call. → Expect: response.metrics.accumulated_usage reports a non-zero cacheWriteInputTokens for the cached prefix.","Make a second call with the identical system prompt but a different user message, within the cache TTL (5 minutes or 1 hour depending on checkpoint config). → Expect: accumulated_usage now reports cacheReadInputTokens instead of cacheWriteInputTokens, billed at a substantial discount versus fresh input tokens.","Also enable cache_tools=\"default\" on the BedrockModel if the agent has a stable tool list. → Expect: tool schemas get their own cache checkpoint, so tool definitions are also billed at the cache-read discount on the second call."],"code":{"lang":"python","content":"from strands import Agent\nfrom strands.models import BedrockModel\nfrom strands.types.content import SystemContentBlock\n\nsystem_content = [\n    SystemContentBlock(text=\"You are a support agent. \" + \"...\" * 1600),  # exceed min cacheable tokens\n    SystemContentBlock(cachePoint={\"type\": \"default\"}),\n]\n\nmodel = BedrockModel(\n    model_id=\"us.anthropic.claude-sonnet-5\",\n    cache_tools=\"default\",\n)\n\nagent = Agent(model=model, system_prompt=system_content)\n\nresponse1 = agent(\"What's your refund policy?\")\nprint(\"call 1 cache write:\", response1.metrics.accumulated_usage.get(\"cacheWriteInputTokens\"))\nprint(\"call 1 cache read:\", response1.metrics.accumulated_usage.get(\"cacheReadInputTokens\"))\n\nresponse2 = agent(\"How long do shipments usually take?\")\nprint(\"call 2 cache write:\", response2.metrics.accumulated_usage.get(\"cacheWriteInputTokens\"))\nprint(\"call 2 cache read:\", response2.metrics.accumulated_usage.get(\"cacheReadInputTokens\"))\n"},"costImpact":"Cache reads are billed at a fraction of fresh input token price (exact discount depends on the Bedrock pricing page for the model). For an agent with a large, stable system prompt and tool catalog (the exact content Tabs 2 and 5 optimized), this can cut the dominant fixed per-call cost sharply for any calls that land within the cache TTL of a prior call.","globalNum":12},{"title":"Build a simple semantic cache for repeat questions","goal":"Skip the model call entirely for a question that's a near-duplicate of one already answered.","steps":["Maintain a cache of (query, embedding, answer) tuples.","For each incoming query, embed it and compare cosine similarity against cached entries.","If similarity exceeds a high threshold (e.g. 0.92), return the cached answer directly, with zero model call. → Expect: near-duplicate phrasings of a previously-asked question ('What's your refund policy?' vs 'Can I get a refund?') both resolve from cache after the first is answered.","If below threshold, call the model normally and add the new (query, embedding, answer) to the cache. → Expect: genuinely novel questions still get a full, fresh model call."],"code":{"lang":"python","content":"import numpy as np\n\nclass SemanticCache:\n    def __init__(self, embed_fn, threshold=0.92):\n        self.embed_fn = embed_fn\n        self.threshold = threshold\n        self.entries = []  # list of (embedding, query, answer)\n\n    def lookup(self, query):\n        query_emb = self.embed_fn(query)\n        for emb, cached_query, answer in self.entries:\n            similarity = np.dot(query_emb, emb) / (np.linalg.norm(query_emb) * np.linalg.norm(emb))\n            if similarity >= self.threshold:\n                return answer\n        return None\n\n    def store(self, query, answer):\n        self.entries.append((self.embed_fn(query), query, answer))\n"},"costImpact":"For a high-repeat-question workload (support FAQ, internal helpdesk), a semantic cache with a well-tuned threshold can absorb a large share of traffic with zero model-call cost per hit -- the exact fraction depends on how repetitive real queries are, so measure hit rate on real traffic before assuming a number.","globalNum":13}],"sources":[{"title":"Anthropic — Prompt caching","url":"https://platform.claude.com/docs/en/build-with-claude/prompt-caching","dateChecked":"2026-08-11","claim":"Underlying prompt caching mechanics (cache breakpoints, TTL behavior, discounted pricing for cache reads) that Strands' Bedrock caching options build on."},{"title":"Strands Agents — Amazon Bedrock model provider (Caching section)","url":"https://strandsagents.com/docs/user-guide/concepts/model-providers/amazon-bedrock/","dateChecked":"2026-08-11","claim":"SystemContentBlock with cachePoint for system prompt caching, cache_tools=\"default\" for tool caching, and cacheWriteInputTokens/cacheReadInputTokens fields on response.metrics.accumulated_usage. Note: Strands' general docs cite older per-model minimums (e.g. 1,024 tokens) that differ from the current Sonnet 5 / Haiku 4.5 model cards below (4,096) -- always verify the specific model's own card."},{"title":"Amazon Bedrock — Claude Sonnet 5 model card (prompt caching table)","url":"https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5.html","dateChecked":"2026-08-11","claim":"Confirms prompt caching is supported for Claude Sonnet 5 on Bedrock, with a minimum of 4,096 tokens per cache checkpoint, up to 4 checkpoints per request, and 5-minute or 1-hour TTL options."}]},{"id":"observability-governance","title":"Observability, Budgets & Governance at Scale","tier":9,"tierLabel":"Closing tab -- how you know it's working, and how you stop it if it isn't","status":"stable","summary":"There is no /usage for a production agent. Cost attribution, dashboards, rate limits, and kill switches are the closing piece that lets everything built in Tiers 1-8 actually be verified and governed once it's running unattended.","whyItMatters":"Every optimization in this workshop is unverifiable without measurement. Without per-task/per-user cost attribution, you can't tell a cascade's escalation rate (Tab 4), a cache's hit rate (Tab 9), or a circuit breaker's trigger rate (Tab 8) -- you're optimizing blind.","concepts":[{"heading":"Attribute cost at the finest grain you'll actually query","body":"Log token usage per call tagged with task id, user/tenant id, model tier used, and which tool(s) were invoked -- not just an aggregate daily total. The finest grain you log is the finest grain you can later slice a cost spike down to; you cannot add granularity retroactively to old logs."},{"heading":"Budgets need to be enforceable, not just visible","body":"A dashboard that shows spend after the fact doesn't stop an incident in progress. Per-user, per-tenant, or per-task budget ceilings need to be checked in the same pre-call hook path built in Tab 8, so a budget breach actually blocks further spend rather than just being visible in tomorrow's report."},{"heading":"A kill switch is the last line, not a substitute for the earlier tiers","body":"A global rate limit or emergency stop (disable the agent entirely, per-tenant or fleet-wide) is what you reach for when something upstream failed -- a bad model routing decision, an infinite loop that got past the circuit breaker, a misconfigured cache. It's cheap insurance, but it is not a reason to skip the guardrails in Tab 8."}],"exercises":[{"title":"Build a per-task cost ledger and a tenant-level budget enforcement check","goal":"Log every call with enough dimensions to answer 'which tenant/task/model tier is driving spend,' and enforce a hard per-tenant daily budget in the same pre-call path as Tab 8's guardrails.","steps":["Log every agent(...) call's response.metrics.accumulated_usage, tagged with tenant_id, task_id, and the BedrockModel's model_id, to a structured log (or a simple SQLite table for a first pass).","Write a query that sums cost by tenant for the current day. → Expect: you can identify, without guessing, which tenant is responsible for any given day's spend.","Wire a tenant-level budget check into the Tab 8 AgentGuardrails hook: before allowing a tool call, sum today's spend for this tenant_id; if over their daily budget, set event.cancel_tool with a clear budget-exceeded message. → Expect: a tenant deliberately driven over budget in a test is blocked on the next tool call, not merely flagged after the fact.","Simulate a runaway scenario (a loop that would exceed budget) and confirm the enforcement check actually halts it before the budget is exceeded, not after. → Expect: total spend for that tenant caps at or near the configured limit, not past it."],"code":{"lang":"python","content":"import sqlite3\nfrom strands import Agent\nfrom strands.hooks import HookProvider, HookRegistry, BeforeToolCallEvent\nfrom strands.models import BedrockModel\n\nconn = sqlite3.connect(\"cost_ledger.db\")\nconn.execute(\"\"\"\n    CREATE TABLE IF NOT EXISTS calls (\n        ts REAL, tenant_id TEXT, task_id TEXT, model TEXT,\n        input_tokens INTEGER, output_tokens INTEGER\n    )\n\"\"\")\n\ndef log_call(tenant_id, task_id, model_id, accumulated_usage, ts):\n    conn.execute(\n        \"INSERT INTO calls VALUES (?, ?, ?, ?, ?, ?)\",\n        (ts, tenant_id, task_id, model_id,\n         accumulated_usage.get(\"inputTokens\", 0), accumulated_usage.get(\"outputTokens\", 0)),\n    )\n    conn.commit()\n\ndef today_token_spend(tenant_id, day_start_ts):\n    row = conn.execute(\n        \"SELECT COALESCE(SUM(input_tokens + output_tokens), 0) FROM calls \"\n        \"WHERE tenant_id = ? AND ts >= ?\",\n        (tenant_id, day_start_ts),\n    ).fetchone()\n    return row[0]\n\nclass TenantBudgetGuardrail(HookProvider):\n    def __init__(self, tenant_id: str, day_start_ts: float, daily_token_budget: int):\n        self.tenant_id = tenant_id\n        self.day_start_ts = day_start_ts\n        self.daily_token_budget = daily_token_budget\n\n    def register_hooks(self, registry: HookRegistry) -> None:\n        registry.add_callback(BeforeToolCallEvent, self._enforce_budget)\n\n    def _enforce_budget(self, event: BeforeToolCallEvent) -> None:\n        spent = today_token_spend(self.tenant_id, self.day_start_ts)\n        if spent >= self.daily_token_budget:\n            event.cancel_tool = (\n                f\"Tenant {self.tenant_id} has used {spent} tokens today, \"\n                f\"budget is {self.daily_token_budget}. Conclude now.\"\n            )\n\nagent = Agent(\n    model=BedrockModel(model_id=\"us.anthropic.claude-sonnet-5\"),\n    hooks=[TenantBudgetGuardrail(tenant_id=\"acme-corp\", day_start_ts=0, daily_token_budget=2_000_000)],\n)\n"},"costImpact":"Without per-tenant attribution, a single misbehaving tenant or task can silently dominate spend for days before anyone notices in an aggregate report. Enforced budgets convert 'we found out at month end' into 'the call was blocked in real time,' bounding worst-case exposure to roughly one budget period per tenant.","globalNum":14}],"sources":[{"title":"Anthropic — Usage and cost reporting guidance","url":"https://platform.claude.com/docs/en/build-with-claude/usage-cost-api","dateChecked":"2026-08-11","claim":"Usage fields returned per API call (input/output/cache tokens) are the raw data this tab's attribution ledger is built from -- there is no separate usage dashboard for custom API integrations, so self-instrumentation is required."},{"title":"Strands Agents — Hooks concept guide (BeforeToolCallEvent.cancel_tool)","url":"https://strandsagents.com/docs/user-guide/concepts/agents/hooks/","dateChecked":"2026-08-11","claim":"BeforeToolCallEvent.cancel_tool as the enforcement point for blocking a tool call, reused here for tenant-level budget enforcement built directly on the Tab 8 guardrail pattern."}]}]}</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById('workshop-data').textContent);
  document.getElementById('site-title').textContent = data.title;
  document.getElementById('site-subtitle').textContent = data.subtitle;

  const nav = document.getElementById('tabnav');
  const main = document.getElementById('main');

  data.tabs.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.textContent = tab.title.split('—')[0].split(':')[0].trim();
    btn.dataset.tab = tab.id;
    if (i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabnav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tab.id).classList.add('active');
    });
    nav.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tabpanel' + (i === 0 ? ' active' : '');
    panel.id = 'tab-' + tab.id;
    panel.innerHTML = renderTab(tab);
    main.appendChild(panel);
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderTab(tab) {
    let statusBadge = '';
    if (tab.status === 'candidate') statusBadge = '<span class="status-badge status-candidate">CANDIDATE — awaiting review</span>';
    if (tab.status === 'deprecated') statusBadge = '<span class="status-badge status-deprecated">DEPRECATED</span>';

    let html = `
      <div class="tier">
        <div class="tier-num">${tab.tier}</div>
        <div class="tier-text"><strong>${esc(tab.title)}${statusBadge}</strong><span>${esc(tab.tierLabel)}</span></div>
      </div>
      <p class="lede">${esc(tab.summary)}</p>
      <div class="why"><strong>Why it matters for cost:</strong> ${esc(tab.whyItMatters)}</div>
    `;

    (tab.concepts || []).forEach(c => {
      html += `<div class="explain"><h3>${esc(c.heading)}</h3><p>${esc(c.body)}</p></div>`;
    });

    (tab.exercises || []).forEach(ex => {
      html += `<div class="ex">
        <div class="exhead">
          <div class="exnum">${ex.globalNum}</div>
          <div class="extitle">${esc(ex.title)}</div>
        </div>
        <div class="exbody">
          <div class="exwhy">${esc(ex.goal)}</div>
          <ol class="exsteps">${(ex.steps || []).map(s => `<li>${linkifyExpect(s)}</li>`).join('')}</ol>`;
      if (ex.code && ex.code.content) {
        html += `<pre><code>${esc(ex.code.content)}</code></pre>`;
      }
      if (ex.costImpact) {
        html += `<div class="exd cost"><strong>Cost impact:</strong> ${esc(ex.costImpact)}</div>`;
      }
      html += `</div></div>`;
    });

    if (tab.sources && tab.sources.length) {
      html += `<details class="sources"><summary>Sources (${tab.sources.length})</summary><ul>`;
      tab.sources.forEach(s => {
        html += `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> — checked ${esc(s.dateChecked)}. <em>${esc(s.claim)}</em></li>`;
      });
      html += `</ul></details>`;
    }

    return html;
  }

  function linkifyExpect(step) {
    const escaped = esc(step);
    return escaped.replace(/(→ Expect:)/g, '<strong class="expect">$1</strong>');
  }
})();
</script>
</body>
</html>
