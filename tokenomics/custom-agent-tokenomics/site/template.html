<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__SITE_TITLE__</title>
<style>
  :root {
    --navy: #0b2545;
    --teal: #0f766e;
    --amber: #b45309;
    --ink: #1a1a1a;
    --grey: #5a6472;
    --line: #d9dee3;
    --bg: #f7f8fa;
    --code-bg: #0d1117;
    --aws: #ff9900;
    --explainbg: #eef3f8;
    --costbg: #f0f7f4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
  }
  header.site-header {
    background: var(--navy);
    color: #fff;
    padding: 28px 32px 20px;
  }
  header.site-header h1 { margin: 0 0 6px; font-size: 1.6rem; }
  header.site-header p { margin: 0; color: #c9d6e8; font-size: 0.95rem; }
  .tabnav {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    background: #08192f;
    padding: 8px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tabnav button {
    background: transparent;
    border: none;
    color: #aebfd6;
    padding: 10px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    white-space: nowrap;
  }
  .tabnav button.active { background: var(--bg); color: var(--navy); font-weight: 600; }
  .tabnav button:hover:not(.active) { background: rgba(255,255,255,0.08); }
  main { max-width: 980px; margin: 0 auto; padding: 28px 24px 80px; }
  .tabpanel { display: none; }
  .tabpanel.active { display: block; }
  .tier {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, var(--navy), var(--teal));
    color: #fff;
    padding: 16px 20px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .tier .tier-num {
    font-size: 1.8rem;
    font-weight: 700;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tier .tier-text strong { display: block; font-size: 1.05rem; }
  .tier .tier-text span { color: #d7e6f5; font-size: 0.85rem; }
  .lede { font-size: 1rem; color: var(--grey); margin-bottom: 20px; }
  .why {
    background: var(--explainbg);
    border-left: 4px solid var(--teal);
    padding: 12px 16px;
    border-radius: 4px;
    margin-bottom: 24px;
    font-size: 0.92rem;
  }
  .explain { margin-bottom: 18px; }
  .explain h3 { margin: 0 0 6px; font-size: 1rem; color: var(--navy); }
  .explain p { margin: 0; font-size: 0.92rem; color: #333; }
  .ex {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 22px;
    background: #fff;
    overflow: hidden;
  }
  .exhead {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 18px;
    background: #fbfcfd;
    border-bottom: 1px solid var(--line);
  }
  .exnum {
    background: var(--navy);
    color: #fff;
    font-weight: 700;
    font-size: 0.8rem;
    border-radius: 50%;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .extitle { font-weight: 600; font-size: 1.02rem; }
  .exbody { padding: 16px 18px; }
  .exwhy { font-size: 0.9rem; color: var(--grey); margin-bottom: 12px; }
  .exsteps { margin: 0 0 14px; padding-left: 22px; }
  .exsteps li { margin-bottom: 8px; font-size: 0.92rem; }
  .expect { color: var(--teal); }
  pre {
    background: var(--code-bg);
    color: #d4d4d4;
    padding: 14px 16px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 0.82rem;
    margin: 0 0 14px;
  }
  code { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .exd.cost {
    background: var(--costbg);
    border-left: 4px solid var(--amber);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 0.88rem;
  }
  .exd.cost strong { color: var(--amber); }
  .sources {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-size: 0.8rem;
    color: var(--grey);
  }
  .sources summary { cursor: pointer; font-weight: 600; color: var(--navy); }
  .sources ul { margin: 8px 0 0; padding-left: 18px; }
  .sources a { color: var(--teal); }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--navy); }
  .status-badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .status-candidate { background: #fef3c7; color: #92400e; }
  .status-deprecated { background: #fee2e2; color: #991b1b; text-decoration: line-through; }
</style>
</head>
<body>
<header class="site-header">
  <h1 id="site-title"></h1>
  <p id="site-subtitle"></p>
</header>
<nav class="tabnav" id="tabnav"></nav>
<main id="main"></main>

<script id="workshop-data" type="application/json">__WORKSHOP_DATA__</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById('workshop-data').textContent);
  document.getElementById('site-title').textContent = data.title;
  document.getElementById('site-subtitle').textContent = data.subtitle;

  const nav = document.getElementById('tabnav');
  const main = document.getElementById('main');

  data.tabs.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.textContent = tab.title.split('—')[0].split(':')[0].trim();
    btn.dataset.tab = tab.id;
    if (i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabnav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tab.id).classList.add('active');
    });
    nav.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tabpanel' + (i === 0 ? ' active' : '');
    panel.id = 'tab-' + tab.id;
    panel.innerHTML = renderTab(tab);
    main.appendChild(panel);
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderTab(tab) {
    let statusBadge = '';
    if (tab.status === 'candidate') statusBadge = '<span class="status-badge status-candidate">CANDIDATE — awaiting review</span>';
    if (tab.status === 'deprecated') statusBadge = '<span class="status-badge status-deprecated">DEPRECATED</span>';

    let html = `
      <div class="tier">
        <div class="tier-num">${tab.tier}</div>
        <div class="tier-text"><strong>${esc(tab.title)}${statusBadge}</strong><span>${esc(tab.tierLabel)}</span></div>
      </div>
      <p class="lede">${esc(tab.summary)}</p>
      <div class="why"><strong>Why it matters for cost:</strong> ${esc(tab.whyItMatters)}</div>
    `;

    (tab.concepts || []).forEach(c => {
      html += `<div class="explain"><h3>${esc(c.heading)}</h3><p>${esc(c.body)}</p></div>`;
    });

    (tab.exercises || []).forEach(ex => {
      html += `<div class="ex">
        <div class="exhead">
          <div class="exnum">${ex.globalNum}</div>
          <div class="extitle">${esc(ex.title)}</div>
        </div>
        <div class="exbody">
          <div class="exwhy">${esc(ex.goal)}</div>
          <ol class="exsteps">${(ex.steps || []).map(s => `<li>${linkifyExpect(s)}</li>`).join('')}</ol>`;
      if (ex.code && ex.code.content) {
        html += `<pre><code>${esc(ex.code.content)}</code></pre>`;
      }
      if (ex.costImpact) {
        html += `<div class="exd cost"><strong>Cost impact:</strong> ${esc(ex.costImpact)}</div>`;
      }
      html += `</div></div>`;
    });

    if (tab.sources && tab.sources.length) {
      html += `<details class="sources"><summary>Sources (${tab.sources.length})</summary><ul>`;
      tab.sources.forEach(s => {
        html += `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> — checked ${esc(s.dateChecked)}. <em>${esc(s.claim)}</em></li>`;
      });
      html += `</ul></details>`;
    }

    return html;
  }

  function linkifyExpect(step) {
    const escaped = esc(step);
    return escaped.replace(/(→ Expect:)/g, '<strong class="expect">$1</strong>');
  }
})();
</script>
</body>
</html>
